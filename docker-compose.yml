name: celltrace

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: celltrace-app:latest
  env_file:
    - path: .env
      required: false
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    LAKEHOUSE_ROOT: /lakehouse
  volumes:
    - .:/app
    - ${LAKEHOUSE_MOUNT:-lakehouse}:/lakehouse

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: celltrace-airflow:latest
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - path: .env
      required: false
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-celltrace-local-dev-only}
    LAKEHOUSE_ROOT: /lakehouse
    CELLTRACE_HOME: /opt/celltrace
    CELLTRACE_PYTHON: /opt/airflow/celltrace-venv/bin/python
    # Airflow keeps its own DuckDB file so it never contends with `make dbt` for the lock.
    DBT_DUCKDB_PATH: /opt/airflow/celltrace.duckdb
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - .:/opt/celltrace
    - ${LAKEHOUSE_MOUNT:-lakehouse}:/lakehouse
  depends_on:
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      # Each probe starts a JVM, so probe fast only while the broker boots.
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  kafka-init:
    image: apache/kafka:3.8.1
    profiles: ["init"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic ${TOPIC_CELL_TESTS:-cell_tests} --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic ${TOPIC_ASSEMBLY_EVENTS:-assembly_events} --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic ${TOPIC_FAULT_LOG:-fault_log} --partitions 1 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: celltrace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # One-off commands: tests, dbt, scripts. Started with `docker compose run --rm app ...`.
  app:
    <<: *app
    profiles: ["tools"]

  generator:
    <<: *app
    profiles: ["pipeline"]
    command: ["python", "-m", "generator.cell_test_producer"]
    depends_on:
      kafka:
        condition: service_healthy

  streaming:
    <<: *app
    profiles: ["pipeline"]
    command: ["python", "-m", "streaming.run_all"]
    # Checkpoints and idempotent sinks make a restart safe; it resumes where it stopped.
    restart: unless-stopped
    ports:
      - "${SPARK_UI_PORT:-4045}:4040"
    depends_on:
      kafka:
        condition: service_healthy

  dashboard:
    <<: *app
    profiles: ["pipeline"]
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"

  postgres:
    image: postgres:16-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 5s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 5s
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  kafka-data:
  lakehouse:
  postgres-data:
  airflow-logs:
